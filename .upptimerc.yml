# havn status: https://status.havn.gg
# Checks run from GitHub Actions every five minutes; results are committed to
# this repo and the page is built from them. Config reference:
# https://upptime.js.org/docs/configuration
owner: carlitodag
repo: status
user-agent: carlitodag

# the only repo secret the checks may read: the Supabase anon key, which is
# public anyway (it ships in the app) but is kept out of the config for tidiness
secrets:
  - SUPABASE_ANON_KEY

sites:
  - name: Website
    url: https://havn.gg
    maxResponseTime: 3000
  - name: Voice relay (Nuremberg)
    url: https://voice.havn.gg
    expectedStatusCodes: [200]
    maxResponseTime: 2000
  - name: Sign-in and accounts
    url: https://fpdzhfrwvkxrouojbqjd.supabase.co/auth/v1/health
    headers:
      - "apikey: $SUPABASE_ANON_KEY"
    maxResponseTime: 3000
  - name: Live messages
    check: "ws"
    url: wss://fpdzhfrwvkxrouojbqjd.supabase.co/realtime/v1/websocket?apikey=$SUPABASE_ANON_KEY&vsn=1.0.0
  - name: File storage
    url: https://fpdzhfrwvkxrouojbqjd.supabase.co/storage/v1/status
    maxResponseTime: 3000
  - name: Server functions
    url: https://fpdzhfrwvkxrouojbqjd.supabase.co/functions/v1/link-preview
    # GET is refused by design; a 405 means the function runtime answered
    expectedStatusCodes: [405]
    maxResponseTime: 3000

status-website:
  cname: status.havn.gg
  logoUrl: https://havn.gg/favicon.svg
  name: havn status
  theme: dark
  introTitle: "is havn up?"
  introMessage: "Checks every five minutes on the website, the voice relay, sign-in, live messages, file storage and the server functions. Incidents and history below."
  navbar:
    - title: Status
      href: /
    - title: havn.gg
      href: https://havn.gg
    - title: Privacy
      href: https://havn.gg/privacy

assignees:
  - carlitodag
